services:
  app:
    build: .
    container_name: app
    ports:
      - "3000"
    volumes:
      - .:/app
      - /app/node_modules
      - ./mnt:/mnt
    environment:
      - HYPERVISOR=docker
    depends_on:
      clickhouse:
        condition: service_healthy
      clickhouse2:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "25236:25236"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

