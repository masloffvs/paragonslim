services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app
    ports:
      - "3000"
    volumes:
      - ./mnt:/mnt
    environment:
      - HYPERVISOR=docker
    env_file: .env
    depends_on:
      clickhouse:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "25236:25236"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    env_file: .env
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_LOG_LEVEL: trace
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    entrypoint: ["/bin/bash", "-c", "/docker-entrypoint-initdb.d/ch-entrypoint.sh && /entrypoint.sh"]
    ports:
      - "48123:8123"
      - "49440:9000"
    volumes:
      - ./mnt:/mnt
      - ./config.d:/etc/clickhouse-server/config.d.tmp:ro
      - ./ch-entrypoint.sh:/docker-entrypoint-initdb.d/ch-entrypoint.sh:ro
      - /mnt/clickhouse_data:/var/lib/clickhouse
    tmpfs:
      - /etc/clickhouse-server/config.d:rw
    healthcheck:
      test: ["CMD", "wget", "-q", "localhost:8123"]
      interval: 5s
      timeout: 5s
      retries: 5

  clicklens:
    image: ghcr.io/ntk148v/clicklens:latest
    ports:
      - "47123:3000"
    env_file: .env
    environment:
      - CLICKHOUSE_CLUSTERS=[{"id":"primary","label":"Primary","host":"clickhouse","port":8123,"lensUser":"${CLICKLENS_USER}","lensPassword":"${CLICKLENS_PASSWORD}"}]
      - SESSION_SECRET=${SESSION_TOKEN_32}
      - NODE_ENV=production
      - DISABLE_SECURE_COOKIES=true
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped
 
  redis:
    image: redis:7-alpine
    restart: unless-stopped